name: Daily Tracking Notification

on:
  schedule:
    # 23:30 UTC = 6:30pm EST (winter). Drifts to 7:30pm ET during EDT (summer).
    # Moved from 22:00 -> 23:30 UTC (2026-08-27) after the Reason-Finder cloud
    # routine's own buffer was widened from 21:45 to 23:00 UTC -- GitHub
    # Actions cron in this repo has shown delays up to ~100 minutes, which
    # caused a real same-day race (track-pool.yml ran late, Reason-Finder
    # found an empty table, notify-tracking sent "all pending"). This 30-min
    # buffer after Reason-Finder's new slot is deliberately generous for the
    # same reason. Standard cron can't auto-adjust for DST; update to
    # "30 22 * * 1-5" for EDT months.
    - cron: '30 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send tracking notification
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DAILY_TRACKING_DATA_SOURCE_ID: ${{ secrets.NOTION_DAILY_TRACKING_DATA_SOURCE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node stock-screener/scripts/notify-tracking.js
